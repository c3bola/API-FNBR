/matches/{match_id}/game-state-observations:
  get:
    summary: Lists GameState values observed over the match.
    operationId: listGameStateObservations
    tags: [Matches]
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: match_id
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    - in: query
      name: from_seconds
      schema: {type: number, format: double, minimum: 0}
    - in: query
      name: to_seconds
      schema: {type: number, format: double, minimum: 0}
    - in: query
      name: page
      schema: {type: integer, minimum: 1, default: 1}
    - in: query
      name: page_size
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    responses:
      '200':
        description: Ordered source observations; repeated identical adjacent updates may already be omitted by the parser.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ./../schemas/responses.yaml#/ReplayPage
              - type: object
                properties:
                  data:
                    items:
                      $ref: ./../schemas/snapshot.yaml#/GameStateObservationSnapshot
      '400':
        $ref: ../../../components/responses.yaml#/responses/BadRequest
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        $ref: ../../../components/responses.yaml#/responses/NotFound
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError

/matches/{match_id}/players/{match_player_id}/movement:
  get:
    summary: Pages through a player's Full-mode movement snapshots.
    description: >
      Both bounds are required and use source world seconds. Results use
      keyset pagination; an empty page does not mean the parser observed no
      player or that movement was read in a non-Full parse.
    operationId: listMatchPlayerMovement
    tags: [Players, Matches]
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: match_id
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    - in: path
      name: match_player_id
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    - in: query
      name: from_seconds
      required: true
      description: Inclusive lower bound on replicated world time.
      schema: {type: number, format: double, minimum: 0}
    - in: query
      name: to_seconds
      required: true
      description: Exclusive upper bound on replicated world time.
      schema: {type: number, format: double, minimum: 0}
    - in: query
      name: cursor
      description: Opaque cursor returned by the previous page.
      schema: {type: string}
    - in: query
      name: page_size
      schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
    responses:
      '200':
        description: Bounded movement samples and an optional next cursor.
        content:
          application/json:
            schema:
              $ref: ./../schemas/observations.yaml#/MovementSamplePage
      '400':
        $ref: ../../../components/responses.yaml#/responses/BadRequest
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        $ref: ../../../components/responses.yaml#/responses/NotFound
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError

