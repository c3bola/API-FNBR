/matches/{match_id}/map:
  get:
    summary: Gets map and world observations for a match.
    description: POI tags are returned as observed and are not resolved to named POIs.
    operationId: getMatchMap
    tags: [Maps, Matches]
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: match_id
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    responses:
      '200':
        description: Map grid, tags, bus paths, safe-zone centers/radii, and observed map actors.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ./../schemas/responses.yaml#/ReplayObject
              - type: object
                properties:
                  data:
                    $ref: ./../schemas/map.yaml#/MapSnapshot
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        $ref: ../../../components/responses.yaml#/responses/NotFound
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError

/matches/{match_id}/map/poi-tags:
  get:
    summary: Lists POI tags observed in a match map.
    description: Tags do not identify a named POI or a player visit.
    operationId: listMatchPoiTags
    tags: [Maps, POIs]
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: match_id
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    - in: query
      name: page
      schema: {type: integer, minimum: 1, default: 1}
    - in: query
      name: page_size
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    responses:
      '200':
        description: Ordered POI tags exactly as recorded.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ./../schemas/responses.yaml#/ReplayPage
              - type: object
                properties:
                  data:
                    items: {type: string}
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        $ref: ../../../components/responses.yaml#/responses/NotFound
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError

