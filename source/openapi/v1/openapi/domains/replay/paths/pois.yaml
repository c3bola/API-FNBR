/pois:
  get:
    summary: Lists points of interest by map and season.
    operationId: poisGet
    tags:
    - POIs
    security:
    - bearerAuth: []
    parameters:
    - in: query
      name: mapCode
      required: true
      schema:
        type: string
    - in: query
      name: seasonCode
      schema:
        type: string
      description: Filters by season code; omit to include all seasons.
    responses:
      '200':
        description: POIs matching the map and season.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/poi.yaml#/POI
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized

/matches/{matchId}/players/{matchPlayerId}/poi-visits:
  get:
    summary: Lists consolidated POI visits for a match participant.
    description: Returns visit intervals only; it does not expose a coordinate trail.
    operationId: matchesMatchIdPlayersMatchPlayerIdPoiVisitsGet
    tags:
    - POIs
    - Players
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: matchId
      required: true
      schema:
        type: integer
        format: int64
    - in: path
      name: matchPlayerId
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: Consolidated visits recorded for the participant in this match.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/poi.yaml#/PlayerPOIVisit
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        description: Match participant not found.
