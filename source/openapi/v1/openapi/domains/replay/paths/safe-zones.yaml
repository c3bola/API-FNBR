/matches/{matchId}/safe-zone-phases:
  get:
    summary: Lists Safe Zone phases recorded for a match.
    operationId: matchesMatchIdSafeZonePhasesGet
    tags:
    - Safe Zones
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: matchId
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: Storm phase information available for this match.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/safeZonePhase.yaml#/SafeZonePhase
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        description: Match not found.
