/replay-files:
  get:
    summary: Lists registered Replay files.
    operationId: replayFilesGet
    tags:
    - Replay Files
    security:
    - bearerAuth: []
    parameters:
    - in: query
      name: sha256
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
      description: Filters by the file's SHA-256 hash.
    - in: query
      name: matchId
      schema:
        type: integer
        format: int64
      description: Filters by the associated match.
    responses:
      '200':
        description: Replay files matching the filters.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/replayFile.yaml#/ReplayFile
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '400':
        $ref: ../../../components/responses.yaml#/responses/BadRequest
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError
  post:
    summary: Registers Replay file metadata by its SHA-256 hash.
    description: Registers Replay file metadata idempotently; the database does not store Replay file contents.
    operationId: replayFilesPost
    tags:
    - Replay Ingestion
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/replayFile.yaml#/ReplayFileRegistration
    responses:
      '201':
        description: Replay file metadata registered.
        content:
          application/json:
            schema:
              $ref: ../schemas/replayFile.yaml#/ReplayFile
      '200':
        description: Matching Replay file metadata was already registered.
        content:
          application/json:
            schema:
              $ref: ../schemas/replayFile.yaml#/ReplayFile
      '400':
        $ref: ../../../components/responses.yaml#/responses/BadRequest
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '409':
        $ref: ../../../components/responses.yaml#/responses/Conflict
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError

/replay-files/{sha256}:
  get:
    summary: Gets Replay file metadata by its SHA-256 hash.
    operationId: replayFilesSha256Get
    tags:
    - Replay Files
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: sha256
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    responses:
      '200':
        description: Replay file metadata.
        content:
          application/json:
            schema:
              $ref: ../schemas/replayFile.yaml#/ReplayFile
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        $ref: ../../../components/responses.yaml#/responses/NotFound
      '400':
        $ref: ../../../components/responses.yaml#/responses/BadRequest
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError

/replay-files/{sha256}/processing-attempts:
  get:
    summary: Lists processing attempts for a Replay file.
    operationId: replayFilesSha256ProcessingAttemptsGet
    tags:
    - Replay Files
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: sha256
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    responses:
      '200':
        description: Processing attempts in recorded history.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/replayProcessingAttempt.yaml#/ReplayProcessingAttempt
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        $ref: ../../../components/responses.yaml#/responses/NotFound
      '400':
        $ref: ../../../components/responses.yaml#/responses/BadRequest
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError
  post:
    summary: Ingests the extracted data for a registered Replay file.
    description: >
      Creates a processing attempt and atomically persists the match snapshot and
      Replay-observed records. Reusing an idempotency key with the same payload
      returns the original attempt; use a new key to explicitly reprocess.
    operationId: replayFilesSha256ProcessingAttemptsPost
    tags:
    - Replay Ingestion
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: sha256
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ingestion.yaml#/ReplayIngestionRequest
    responses:
      '201':
        description: A new processing attempt completed successfully.
        content:
          application/json:
            schema:
              $ref: ../schemas/replayProcessingAttempt.yaml#/ReplayProcessingAttempt
      '200':
        description: The idempotency key already has a completed attempt.
        content:
          application/json:
            schema:
              $ref: ../schemas/replayProcessingAttempt.yaml#/ReplayProcessingAttempt
      '202':
        description: The same idempotent request is already being processed.
        content:
          application/json:
            schema:
              $ref: ../schemas/replayProcessingAttempt.yaml#/ReplayProcessingAttempt
      '422':
        description: The attempt was recorded as failed and its derived-data transaction was rolled back.
        content:
          application/json:
            schema:
              $ref: ../schemas/replayProcessingAttempt.yaml#/ReplayProcessingAttempt
      '400':
        $ref: ../../../components/responses.yaml#/responses/BadRequest
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        $ref: ../../../components/responses.yaml#/responses/NotFound
      '409':
        $ref: ../../../components/responses.yaml#/responses/Conflict
      '500':
        $ref: ../../../components/responses.yaml#/responses/InternalServerError
