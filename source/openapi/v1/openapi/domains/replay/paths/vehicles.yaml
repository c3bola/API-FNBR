/vehicles:
  get:
    summary: Lists vehicle catalog entries.
    operationId: vehiclesGet
    tags:
    - Vehicles
    security:
    - bearerAuth: []
    parameters:
    - in: query
      name: vehicleClass
      schema:
        type: string
    responses:
      '200':
        description: Vehicle catalog entries.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/vehicle.yaml#/Vehicle
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized

/matches/{matchId}/players/{matchPlayerId}/vehicle-usages:
  get:
    summary: Lists recorded vehicle usage summaries for a match participant.
    description: Each item is the database's per-match, per-player, per-vehicle summary; it is not an individual boarding session.
    operationId: matchesMatchIdPlayersMatchPlayerIdVehicleUsagesGet
    tags:
    - Vehicles
    - Players
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: matchId
      required: true
      schema:
        type: integer
        format: int64
    - in: path
      name: matchPlayerId
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: Vehicle usage summaries for the participant in this match.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/vehicle.yaml#/PlayerVehicleUsage
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        description: Match participant not found.
