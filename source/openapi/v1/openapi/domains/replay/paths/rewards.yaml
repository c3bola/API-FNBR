/matches/{matchId}/rewards:
  get:
    summary: Lists rewards observed in a match.
    operationId: matchesMatchIdRewardsGet
    tags:
    - Rewards
    security:
    - bearerAuth: []
    parameters:
    - in: path
      name: matchId
      required: true
      schema:
        type: integer
        format: int64
    - in: query
      name: matchPlayerId
      schema:
        type: integer
        format: int64
    - in: query
      name: rewardCode
      schema:
        type: string
      description: Filters by the stored reward type code, including dynamic codes.
    responses:
      '200':
        description: Rewards recorded for this match.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/reward.yaml#/Reward
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
      '404':
        description: Match not found.

/reward-types:
  get:
    summary: Lists reward types used by observed rewards.
    operationId: rewardTypesGet
    tags:
    - Rewards
    security:
    - bearerAuth: []
    parameters:
    - in: query
      name: category
      schema:
        type: string
    - in: query
      name: rewardCode
      schema:
        type: string
    responses:
      '200':
        description: Reward types matching the filters.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/reward.yaml#/RewardType
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
