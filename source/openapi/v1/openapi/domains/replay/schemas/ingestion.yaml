ReplayIngestionRequest:
  type: object
  additionalProperties: true
  required:
  - application_id
  - idempotency_key
  - analyzer_version
  - data
  properties:
    application_id:
      type: string
      minLength: 1
      maxLength: 150
      description: Identifies the submitting application for traceability; it is not an authentication credential or a replay or match identifier.
    idempotency_key:
      type: string
      minLength: 1
      maxLength: 200
      description: Stable retry key. Use a new value for an intentional reprocess.
    analyzer_version:
      $ref: '#/ReplayAnalyzerVersionInput'
    data:
      $ref: ./snapshot.yaml#/ParserReplayData

ReplayAnalyzerVersionInput:
  type: object
  additionalProperties: true
  required:
  - application_version
  - analyzer_version
  - parser_name
  - parser_version
  properties:
    application_version:
      type: string
      minLength: 1
      maxLength: 50
    analyzer_version:
      type: string
      minLength: 1
      maxLength: 50
    parser_name:
      type: string
      minLength: 1
      maxLength: 100
    parser_version:
      type: string
      minLength: 1
      maxLength: 100
    description:
      type: string
      nullable: true
      maxLength: 500
