ReplayFile:
  type: object
  additionalProperties: false
  required: [file_sha256, first_registered_at]
  properties:
    file_sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    first_registered_at:
      type: string
      format: date-time
    application_ids:
      type: array
      items: {type: string}
    latest_received_at:
      type: string
      format: date-time
      nullable: true
    processing_attempt_count:
      type: integer
      format: int64
      minimum: 0
