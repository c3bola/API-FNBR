    playerNameCustomOverride: {type: string, nullable: true}
    streamerModeName: {type: string, nullable: true}
    platform: {type: string, nullable: true}
    level: {type: integer, format: int32, nullable: true}
    seasonLevelUIDisplay: {type: integer, format: int64, nullable: true}
    inventoryId: {type: integer, format: int64, nullable: true, minimum: 0, maximum: 4294967295}
    playerNumber: {type: integer, format: int32, nullable: true}
    teamIndex: {type: integer, format: int32, nullable: true}
    isPartyLeader: {type: boolean, nullable: true}
    isReplayOwner: {type: boolean, nullable: true}
    isGameSessionOwner: {type: boolean, nullable: true}
    hasFinishedLoading: {type: boolean, nullable: true}
    hasStartedPlaying: {type: boolean, nullable: true}
    hasThankedBusDriver: {type: boolean, nullable: true}
    isUsingStreamerMode: {type: boolean, nullable: true}
    isUsingAnonymousMode: {type: boolean, nullable: true}
    disconnected: {type: boolean, nullable: true}
    rebootCounter: {type: integer, format: int64, nullable: true, minimum: 0}
    placement: {type: integer, format: int32, nullable: true}
    kills: {type: integer, format: int64, nullable: true, minimum: 0}
    teamKills: {type: integer, format: int64, nullable: true, minimum: 0}
    deathCause: {type: integer, format: int32, nullable: true}
    deathCircumstance: {type: integer, format: int32, nullable: true}
    deathTags:
      type: array
      nullable: true
      items: {type: string}
    deathLocation:
      type: object
      nullable: true
      allOf:
        - $ref: '#/Vector3Snapshot'
    deathTime: {type: number, format: float, nullable: true}
    deathTimeDouble: {type: number, format: double, nullable: true}
    cosmetics:
      type: object
      nullable: true
      allOf:
        - $ref: '#/CosmeticsSnapshot'
    currentWeapon: {type: integer, format: int64, nullable: true, minimum: 0}
    locations:
      type: array
      nullable: true
      items:
        $ref: '#/MovementSnapshot'

CosmeticsSnapshot:
  type: object
  additionalProperties: true
  properties:
    character: {description: Named by the dictionary; serialized type is not specified.}
    parts: {description: Named by the dictionary; serialized type and member schema are not specified.}
    gender: {description: Named by the dictionary; serialized type is not specified.}
    type: {description: Named by the dictionary; serialized type is not specified.}
    banner: {description: Named by the dictionary; serialized type and member schema are not specified.}
