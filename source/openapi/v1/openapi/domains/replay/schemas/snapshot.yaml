    glider: {description: Named by the dictionary; serialized type is not specified.}
    pickaxe: {description: Named by the dictionary; serialized type is not specified.}
    wraps: {description: Named by the dictionary; serialized type and member schema are not specified.}
    contrail: {description: Named by the dictionary; serialized type is not specified.}
    dances: {description: Named by the dictionary; serialized type and member schema are not specified.}
