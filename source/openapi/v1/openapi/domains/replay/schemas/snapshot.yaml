ParserReplayData:
  type: object
  description: >
    Preserved exactly on receipt. Known fields are normalized asynchronously;
    unknown or invalid fields are retained in the original payload and reported
    as processing inconsistencies.
  additionalProperties: true
  properties:
    parseMode:
      type: string
      enum: [EventsOnly, Minimal, Normal, Full]
    match:
      type: object
      nullable: true
      allOf:
        - $ref: '#/MatchSnapshot'
    players:
      type: array
      nullable: true
      items:
        $ref: '#/PlayerSnapshot'
    teams:
      type: array
      nullable: true
      items:
        $ref: '#/TeamSnapshot'
    eventEliminations:
      type: array
      nullable: true
      items:
        $ref: '#/EventEliminationSnapshot'
    killFeed:
      type: array
      nullable: true
      items:
        $ref: '#/KillFeedSnapshot'
    map:
      type: object
      nullable: true
      allOf:
        - $ref: '#/ParserMapSnapshot'
    weapons:
      type: array
      nullable: true
      items:
        $ref: '#/WeaponSnapshot'
    observations:
      type: object
      nullable: true
      allOf:
        - $ref: '#/ObservationsSnapshot'

MatchSnapshot:
  type: object
  additionalProperties: true
  properties:
    gameData:
      type: object
      nullable: true
      allOf:
        - $ref: '#/GameDataSnapshot'
    replayTimestamp:
      type: string
      nullable: true
    replayLengthInMilliseconds:
      type: integer
      format: int64
      nullable: true
      minimum: 0
    replayBranch:
      type: string
      nullable: true
    stats:
      type: object
      nullable: true
      allOf:
        - $ref: '#/MatchStatsSnapshot'
    teamStats:
      type: object
      nullable: true
      allOf:
        - $ref: '#/TeamStatsSnapshot'

GameDataSnapshot:
  type: object
  additionalProperties: true
  properties:
    gameSessionId:
      type: string
      nullable: true
    utcTimeStartedMatch:
      type: string
      nullable: true
    matchEndTime:
      type: number
      format: float
      nullable: true
    currentPlaylist:
      type: string
      nullable: true
    mapInfo:
      type: string
      nullable: true
    additionalPlaylistLevels:
      type: array
      nullable: true
      items: {type: string}
    activeGameplayModifiers:
      type: array
      nullable: true
      items: {type: string}
    recorderId:
      type: integer
      format: int64
      nullable: true
      minimum: 0
    maxPlayers: {type: integer, format: int32, nullable: true}
    totalTeams: {type: integer, format: int32, nullable: true}
    totalBots: {type: integer, format: int32, nullable: true}
    tournamentRound: {type: integer, format: int32, nullable: true}
    isLargeTeamGame: {type: boolean, nullable: true}
    teamCount:
      type: integer
      format: int32
      nullable: true
    teamSize:
      type: integer
      format: int32
      nullable: true
    playerBotsLeft:
      type: integer
      format: int32
      nullable: true
    playersLeft:
      type: integer
      format: int32
      nullable: true
    teamsLeft:
      type: integer
      format: int32
      nullable: true
    elapsedTime:
      type: integer
      format: int32
      nullable: true
    gamePhase:
      type: integer
      format: int32
      nullable: true
    safeZonePhase:
      type: integer
      format: int32
      nullable: true
    hasBegunPlay:
      type: boolean
      nullable: true
    totalPlayerStructures:
      type: integer
      format: int64
      nullable: true
    winningTeam:
      type: integer
      format: int64
      nullable: true
    winningPlayerIds:
      type: array
      nullable: true
      items: {type: integer, format: int32}
    aircraftStartTime:
      type: number
      format: float
      nullable: true
    safeZonesStartTime:
      type: number
      format: float
      nullable: true
    gameStateObservations:
      type: array
      nullable: true
      items:
        $ref: '#/GameStateObservationSnapshot'

GameStateObservationSnapshot:
  type: object
  additionalProperties: true
  properties:
    worldTimeSeconds: {type: number, format: double, nullable: true}
    replicatedWorldTimeSeconds: {type: number, format: float, nullable: true}
    replicatedWorldTimeSecondsDouble: {type: number, format: double, nullable: true}
    hasBegunPlay: {type: boolean, nullable: true}
    teamCount: {type: integer, format: int32, nullable: true}
    teamSize: {type: integer, format: int32, nullable: true}
    playerBotsLeft: {type: integer, format: int32, nullable: true}
    playersLeft: {type: integer, format: int32, nullable: true}
    teamsLeft: {type: integer, format: int32, nullable: true}
    elapsedTime: {type: integer, format: int32, nullable: true}
    gamePhase: {type: integer, format: int32, nullable: true}
    safeZonePhase: {type: integer, format: int32, nullable: true}

MatchStatsSnapshot:
  type: object
  additionalProperties: true
  properties:
    info:
      type: object
      nullable: true
      allOf:
        - $ref: '#/EventInfoSnapshot'
    totalTraveled: {type: number, format: double, nullable: true}
    accuracy: {type: number, format: double, nullable: true}
    unknown: {type: integer, format: int64, nullable: true}
    assists: {type: integer, format: int64, nullable: true}
    eliminations: {type: integer, format: int64, nullable: true}
    weaponDamage: {type: integer, format: int64, nullable: true}
    otherDamage: {type: integer, format: int64, nullable: true}
    revives: {type: integer, format: int64, nullable: true}
    damageTaken: {type: integer, format: int64, nullable: true}
    damageToStructures: {type: integer, format: int64, nullable: true}
    materialsGathered: {type: integer, format: int64, nullable: true}
    materialsUsed: {type: integer, format: int64, nullable: true}

TeamStatsSnapshot:
  type: object
  additionalProperties: true
  properties:
    info:
      type: object
      nullable: true
      allOf:
        - $ref: '#/EventInfoSnapshot'
    unknown: {type: integer, format: int64, nullable: true}
    position: {type: integer, format: int64, minimum: 0}
    totalPlayers: {type: integer, format: int64, minimum: 0}

PlayerSnapshot:
  type: object
  additionalProperties: true
  properties:
    id: {type: integer, format: int32, nullable: true}
    playerId: {type: string, nullable: true}
    epicId: {type: string, nullable: true}
    platformUniqueNetId: {type: string, nullable: true}
    botId: {type: string, nullable: true}
