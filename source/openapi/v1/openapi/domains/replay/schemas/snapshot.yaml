    lootFinalPosition:
      type: object
      nullable: true
      allOf:
        - $ref: '#/Vector3Snapshot'
    finalTossRestLocation:
      type: object
      nullable: true
      allOf:
        - $ref: '#/Vector3Snapshot'
    flyTime: {type: number, format: double, nullable: true}
    tossState: {type: integer, format: int32, nullable: true}
    pickedUp: {type: boolean, nullable: true}

TreasureEventSnapshot:
