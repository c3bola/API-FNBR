Match:
  type: object
  required:
  - id
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    matchStartAt:
      type: string
      format: date-time
      nullable: true
    matchEndAt:
      type: string
      format: date-time
      nullable: true
    durationSeconds:
      type: number
      format: double
      nullable: true
      minimum: 0
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    totalPlayers:
      type: integer
      format: int32
      nullable: true
      minimum: 0
    totalTeams:
      type: integer
      format: int32
      nullable: true
      minimum: 0
    chapterNumber:
      type: integer
      format: int32
      nullable: true
    isCustomMatch:
      type: boolean
      nullable: true
    sessionId:
      type: string
      nullable: true
      maxLength: 150
    playlist:
      type: string
      nullable: true
      maxLength: 150
    gameMode:
      type: string
      nullable: true
      maxLength: 100
    mapCode:
      type: string
      nullable: true
      maxLength: 100
    mapName:
      type: string
      nullable: true
      maxLength: 150
    seasonCode:
      type: string
      nullable: true
      maxLength: 80
    gameVersion:
      type: string
      nullable: true
      maxLength: 80

MatchStats:
  type: object
  required:
  - id
  - matchId
  properties:
    id:
      type: integer
      format: int64
    matchId:
      type: integer
      format: int64
    matchPlayerId:
      type: integer
      format: int64
      nullable: true
      description: Optional participant reference stored with the match-level payload.
    totalTraveled:
      type: number
      format: double
      nullable: true
      minimum: 0
    accuracy:
      type: number
      format: double
      nullable: true
      minimum: 0
    unknown:
      type: integer
      format: int32
      nullable: true
    assists:
      type: integer
      format: int32
      nullable: true
    eliminations:
      type: integer
      format: int32
      nullable: true
    weaponDamage:
      type: integer
      format: int32
      nullable: true
    otherDamage:
      type: integer
      format: int32
      nullable: true
    revives:
      type: integer
      format: int32
      nullable: true
    damageTaken:
      type: integer
      format: int32
      nullable: true
    damageToStructures:
      type: integer
      format: int32
      nullable: true
    materialsGathered:
      type: integer
      format: int32
      nullable: true
    materialsUsed:
      type: integer
      format: int32
      nullable: true
