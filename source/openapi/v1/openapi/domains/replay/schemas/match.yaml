Match:
  type: object
  additionalProperties: false
  required: [id, identity_key, created_at, updated_at]
  properties:
    id: {type: integer, format: int64}
    identity_key:
      type: string
      description: Derived as session:<gameSessionId> or, when absent, replay:<file_sha256>.
    game_session_id: {type: string, nullable: true}
    replay_timestamp: {type: string, format: date-time, nullable: true}
    replay_length_milliseconds: {type: integer, format: int32, nullable: true, minimum: 0}
    replay_branch: {type: string, nullable: true}
    utc_time_started_match: {type: string, format: date-time, nullable: true}
    match_end_time: {type: number, format: double, nullable: true}
    current_playlist: {type: string, nullable: true}
    map_info: {type: string, nullable: true}
    additional_playlist_levels:
      type: array
      nullable: true
      items: {type: string}
    active_gameplay_modifiers:
      type: array
      nullable: true
      items: {type: string}
    recorder_id: {type: integer, format: int64, nullable: true, minimum: 0}
    team_count: {type: integer, format: int32, nullable: true, minimum: 0}
    team_size: {type: integer, format: int32, nullable: true, minimum: 0}
    player_bots_left: {type: integer, format: int32, nullable: true, minimum: 0}
    players_left: {type: integer, format: int32, nullable: true, minimum: 0}
    teams_left: {type: integer, format: int32, nullable: true, minimum: 0}
    elapsed_time: {type: integer, format: int32, nullable: true}
    game_phase: {type: integer, format: int32, nullable: true}
    safe_zone_phase: {type: integer, format: int32, nullable: true, minimum: 0}
    has_begun_play: {type: boolean, nullable: true}
    total_player_structures: {type: integer, format: int64, nullable: true}
    winning_team: {type: integer, format: int64, nullable: true, minimum: 0}
    winning_player_ids:
      type: array
      nullable: true
      items: {type: integer, format: int32}
    aircraft_start_time: {type: number, format: double, nullable: true}
    safe_zones_start_time: {type: number, format: double, nullable: true}
    team_stats_position: {type: integer, format: int64, nullable: true, minimum: 0}
    team_stats_total_players: {type: integer, format: int64, nullable: true, minimum: 0}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}

MatchStats:
  type: object
  additionalProperties: false
  required: [match_id]
  properties:
    match_id: {type: integer, format: int64}
    total_traveled: {type: number, format: double, nullable: true}
    accuracy: {type: number, format: double, nullable: true}
    unknown_value: {type: integer, format: int32, nullable: true}
    assists: {type: integer, format: int32, nullable: true}
    eliminations: {type: integer, format: int32, nullable: true}
    weapon_damage: {type: integer, format: int32, nullable: true}
    other_damage: {type: integer, format: int32, nullable: true}
    revives: {type: integer, format: int32, nullable: true}
    damage_taken: {type: integer, format: int32, nullable: true}
    damage_to_structures: {type: integer, format: int32, nullable: true}
    materials_gathered: {type: integer, format: int32, nullable: true}
    materials_used: {type: integer, format: int32, nullable: true}
