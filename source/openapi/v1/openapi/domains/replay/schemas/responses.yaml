Pagination:
  type: object
  required:
  - page
  - page_size
  - total
  - total_pages
  properties:
    page:
      type: integer
      minimum: 1
    page_size:
      type: integer
      minimum: 1
      maximum: 100
    total:
      type: integer
      format: int64
      minimum: 0
    total_pages:
      type: integer
      minimum: 0

ReplayPage:
  type: object
  required:
  - success
  - data
  - pagination
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      type: array
      items: {}
    pagination:
      $ref: '#/Pagination'

ReplayObject:
  type: object
  required:
  - success
  - data
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      type: object

ReplayEnvelope:
  type: object
  required:
  - success
  - data
  properties:
    success:
      type: boolean
      enum: [true]
    data: {}

ReplayErrorResponse:
  type: object
  required:
  - success
  - error
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      $ref: './replayError.yaml#/ReplayError'
