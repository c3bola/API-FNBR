ReplayProcessingAttempt:
  type: object
  additionalProperties: false
  required:
  - id
  - file_sha256
  - application_id
  - idempotency_key
  - request_sha256
  - payload_sha256
  - parse_mode
  - status
  - received_at
  properties:
    id: {type: integer, format: int64}
    file_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    application_id: {type: string}
    idempotency_key: {type: string}
    request_sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: Canonical JSON digest used to enforce the existing idempotency rule.
    payload_sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
      nullable: true
      description: SHA-256 digest of the exact request bytes; null for historical attempts.
    analyzer_version: {type: string, nullable: true}
    application_version: {type: string, nullable: true}
    parser_name: {type: string, nullable: true}
    parser_version: {type: string, nullable: true}
    parse_mode:
      type: string
      enum: [EventsOnly, Minimal, Normal, Full]
      nullable: true
    status:
      type: string
      enum: [accepted, processing, succeeded, failed, skipped]
    error_code: {type: string, nullable: true}
    error_message:
      type: string
      nullable: true
      description: Sanitized processing failure summary; excludes SQL and stack traces.
    received_at: {type: string, format: date-time}
    started_at: {type: string, format: date-time, nullable: true}
    completed_at: {type: string, format: date-time, nullable: true}
