RewardType:
  type: object
  required:
  - id
  - createdAt
  - isActive
  - rewardCode
  properties:
    id:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time
    isActive:
      type: boolean
    rewardCode:
      type: string
      maxLength: 150
      description: Stored reward type code; may be a dynamic identifier.
    category:
      type: string
      nullable: true
      maxLength: 80
    displayName:
      type: string
      nullable: true
      maxLength: 150

Reward:
  type: object
  required:
  - id
  - matchId
  - rewardTypeId
  - rewardCode
  - isTeammateReward
  properties:
    id:
      type: integer
      format: int64
    matchId:
      type: integer
      format: int64
    matchPlayerId:
      type: integer
      format: int64
      nullable: true
    rewardTypeId:
      type: integer
      format: int64
    rewardCode:
      type: string
      description: Reward type code from the catalog, including dynamic codes.
    containerInteractionId:
      type: integer
      format: int64
      nullable: true
    eventTimeSeconds:
      type: number
      format: double
      nullable: true
      minimum: 0
    isGoldenChest:
      type: boolean
      nullable: true
    isTeammateReward:
      type: boolean
    isFromChest:
      type: boolean
      nullable: true
    wasDestroyed:
      type: boolean
      nullable: true
    origin:
      type: string
      nullable: true
      maxLength: 50
    sourceConfidence:
      type: string
      nullable: true
      maxLength: 20
