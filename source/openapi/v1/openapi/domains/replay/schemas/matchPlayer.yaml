Player:
  type: object
  additionalProperties: false
  required: [id, created_at, updated_at]
  properties:
    id: {type: integer, format: int64}
    epic_id: {type: string, nullable: true}
    bot_id: {type: string, nullable: true}
    platform_unique_net_id: {type: string, nullable: true}
    latest_player_name: {type: string, nullable: true}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}

MatchPlayer:
  type: object
  additionalProperties: false
  required: [id, match_id]
  properties:
    id: {type: integer, format: int64}
    match_id: {type: integer, format: int64}
    player_identity_id: {type: integer, format: int64, nullable: true}
    replay_player_id: {type: integer, format: int32, nullable: true}
    parser_player_id: {type: string, nullable: true}
    epic_id: {type: string, nullable: true}
    platform_unique_net_id: {type: string, nullable: true}
    bot_id: {type: string, nullable: true}
    is_bot: {type: boolean, nullable: true}
    player_name: {type: string, nullable: true}
    player_name_custom_override: {type: string, nullable: true}
    streamer_mode_name: {type: string, nullable: true}
    platform: {type: string, nullable: true}
    level: {type: integer, format: int32, nullable: true}
    season_level_ui_display: {type: integer, format: int64, nullable: true, minimum: 0}
    player_number: {type: integer, format: int32, nullable: true}
    team_index: {type: integer, format: int32, nullable: true}
    is_party_leader: {type: boolean, nullable: true}
    is_replay_owner: {type: boolean, nullable: true}
    is_game_session_owner: {type: boolean, nullable: true}
    has_finished_loading: {type: boolean, nullable: true}
    has_started_playing: {type: boolean, nullable: true}
    has_thanked_bus_driver: {type: boolean, nullable: true}
    is_using_streamer_mode: {type: boolean, nullable: true}
    is_using_anonymous_mode: {type: boolean, nullable: true}
    disconnected: {type: boolean, nullable: true}
    reboot_counter: {type: integer, format: int32, nullable: true, minimum: 0}
    placement: {type: integer, format: int32, nullable: true}
    kills: {type: integer, format: int64, nullable: true, minimum: 0}
    team_kills: {type: integer, format: int64, nullable: true, minimum: 0}
    death_cause: {type: integer, format: int32, nullable: true}
    death_circumstance: {type: integer, format: int32, nullable: true}
    death_location:
      type: object
      nullable: true
      allOf:
        - $ref: '#/Vector3'
    death_tags:
      type: array
      nullable: true
      items: {type: string}
    death_time: {type: number, format: double, nullable: true}
    death_time_double: {type: number, format: double, nullable: true}
    current_weapon_actor_id: {type: integer, format: int64, nullable: true, minimum: 0}

PlayerMatchStats:
  type: object
  additionalProperties: false
  required: [match_id, match_player_id]
  properties:
    match_id: {type: integer, format: int64}
    match_player_id: {type: integer, format: int64}
    player_number: {type: integer, format: int32, nullable: true}
    team_index: {type: integer, format: int32, nullable: true}
    placement: {type: integer, format: int32, nullable: true}
    kills: {type: integer, format: int64, nullable: true, minimum: 0}
    team_kills: {type: integer, format: int64, nullable: true, minimum: 0}

Vector3:
  type: object
  additionalProperties: false
  properties:
    x: {type: number, format: double, nullable: true}
    y: {type: number, format: double, nullable: true}
    z: {type: number, format: double, nullable: true}
