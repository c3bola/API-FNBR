POI:
  type: object
  required:
  - id
  - createdAt
  - updatedAt
  - isActive
  - mapCode
  - poiCode
  - displayName
  properties:
    id:
      type: integer
      format: int64
    centerX:
      type: number
      format: double
      nullable: true
    centerY:
      type: number
      format: double
      nullable: true
    centerZ:
      type: number
      format: double
      nullable: true
    boundaryRadius:
      type: number
      format: double
      nullable: true
      minimum: 0
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    isActive:
      type: boolean
    mapCode:
      type: string
      maxLength: 100
    seasonCode:
      type: string
      nullable: true
      maxLength: 80
    poiCode:
      type: string
      maxLength: 150
    displayName:
      type: string
      maxLength: 150
    coordinateSystem:
      type: string
      nullable: true
      maxLength: 100

PlayerPOIVisit:
  type: object
  required:
  - id
  - matchId
  - matchPlayerId
  - poiId
  - startedAtSeconds
  - endedAtSeconds
  - durationSeconds
  properties:
    id:
      type: integer
      format: int64
    matchId:
      type: integer
      format: int64
    matchPlayerId:
      type: integer
      format: int64
    poiId:
      type: integer
      format: int64
    startedAtSeconds:
      type: number
      format: double
      minimum: 0
    endedAtSeconds:
      type: number
      format: double
      minimum: 0
    durationSeconds:
      type: number
      format: double
      minimum: 0
    confidence:
      type: number
      format: double
      nullable: true
      minimum: 0
      maximum: 1
    sampleCount:
      type: integer
      format: int32
      nullable: true
      minimum: 0
    detectionMethod:
      type: string
      nullable: true
      maxLength: 50
