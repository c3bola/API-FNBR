EventElimination:
  type: object
  additionalProperties: false
  required: [id, match_id, event_index]
  properties:
    id: {type: integer, format: int64}
    match_id: {type: integer, format: int64}
    event_index: {type: integer, format: int32, minimum: 0}
    event_info:
      type: object
      additionalProperties: false
      properties:
        group: {type: string, nullable: true}
        metadata: {type: string, nullable: true}
        start_time: {type: number, format: double, nullable: true}
        end_time: {type: number, format: double, nullable: true}
        size_in_bytes: {type: integer, format: int32, nullable: true}
    eliminated:
      $ref: '#/EliminationActor'
    eliminator:
      $ref: '#/EliminationActor'
    gun_type: {type: integer, format: int32, nullable: true, minimum: 0, maximum: 255}
    knocked: {type: boolean, nullable: true}
    library_distance:
      type: number
      format: double
      nullable: true
      description: Distance calculated by the parser library, not a source coordinate.

EliminationActor:
  type: object
  additionalProperties: false
  properties:
    id: {type: string, nullable: true}
    player_type: {type: string, nullable: true}
    location:
      type: object
      nullable: true
      allOf:
        - $ref: ./matchPlayer.yaml#/Vector3
    rotation:
      type: object
      additionalProperties: false
      properties:
        x: {type: number, format: double, nullable: true}
        y: {type: number, format: double, nullable: true}
        z: {type: number, format: double, nullable: true}
        w: {type: number, format: double, nullable: true}
    scale:
      type: object
      nullable: true
      allOf:
        - $ref: ./matchPlayer.yaml#/Vector3

KillFeedEntry:
  type: object
  additionalProperties: false
  required: [id, match_id, event_index]
  properties:
    id: {type: integer, format: int64}
    match_id: {type: integer, format: int64}
    event_index: {type: integer, format: int32, minimum: 0}
    player_replay_id: {type: integer, format: int32, nullable: true}
    player_name: {type: string, nullable: true}
    player_is_bot: {type: boolean, nullable: true}
    finisher_or_downer_replay_id: {type: integer, format: int32, nullable: true}
    finisher_or_downer_name: {type: string, nullable: true}
    finisher_or_downer_is_bot: {type: boolean, nullable: true}
    replicated_world_time_seconds: {type: number, format: float, nullable: true}
    replicated_world_time_seconds_double: {type: number, format: double, nullable: true}
    distance: {type: number, format: float, nullable: true}
    death_cause: {type: integer, format: int32, nullable: true}
    death_circumstance: {type: integer, format: int32, nullable: true}
    death_location:
      type: object
      nullable: true
      allOf:
        - $ref: ./matchPlayer.yaml#/Vector3
    death_tags:
      type: array
      nullable: true
      items: {type: string}
    is_downed: {type: boolean, nullable: true}
    is_revived: {type: boolean, nullable: true}
