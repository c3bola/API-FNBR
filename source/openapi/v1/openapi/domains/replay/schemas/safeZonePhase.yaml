SafeZonePhase:
  type: object
  required:
  - id
  - matchId
  - phaseNumber
  properties:
    id:
      type: integer
      format: int64
    matchId:
      type: integer
      format: int64
    startsAtSeconds:
      type: number
      format: double
      nullable: true
      minimum: 0
    endsAtSeconds:
      type: number
      format: double
      nullable: true
      minimum: 0
    centerX:
      type: number
      format: double
      nullable: true
    centerY:
      type: number
      format: double
      nullable: true
    radius:
      type: number
      format: double
      nullable: true
      minimum: 0
    phaseNumber:
      type: integer
      format: int32
      minimum: 1
