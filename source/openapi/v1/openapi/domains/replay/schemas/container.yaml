Container:
  type: object
  required:
  - id
  - matchId
  - containerKind
  properties:
    id:
      type: integer
      format: int64
    matchId:
      type: integer
      format: int64
    locationX:
      type: number
      format: double
      nullable: true
    locationY:
      type: number
      format: double
      nullable: true
    locationZ:
      type: number
      format: double
      nullable: true
    firstSeenSeconds:
      type: number
      format: double
      nullable: true
      minimum: 0
    replayActorId:
      type: string
      nullable: true
      maxLength: 200
    containerKind:
      type: string
      maxLength: 80
    blueprint:
      type: string
      nullable: true
      maxLength: 255

ContainerInteraction:
  type: object
  required:
  - id
  - matchId
  - containerId
  - eventTimeSeconds
  - isRefillReopen
  - interactionType
  properties:
    id:
      type: integer
      format: int64
    matchId:
      type: integer
      format: int64
    containerId:
      type: integer
      format: int64
    matchPlayerId:
      type: integer
      format: int64
      nullable: true
    eventTimeSeconds:
      type: number
      format: double
      minimum: 0
    isRefillReopen:
      type: boolean
      description: Stored Replay observation flag; it is not inferred by this contract.
    interactionType:
      type: string
      enum:
      - opened
      - destroyed
      - searched
      - unknown
    sourceConfidence:
      type: string
      nullable: true
      maxLength: 20
