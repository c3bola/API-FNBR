# VIP subscriber representation.
VipMember:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
    username:
      type: string
    avatar:
      type: string
    plan:
      type: string
      # Existing plan literals are preserved for backend compatibility.
      enum:
      - R$ 3,00
      - R$ 4,00
      - R$ 5,00
    divulgacoesDiarias:
      type: integer
    status:
      type: string
      enum:
      - Ativo
      - Expirando
      - Inativo
    expiresAt:
      type: string
      format: date-time
    benefits:
      $ref: ./vipBenefits.yaml#/VipBenefits
