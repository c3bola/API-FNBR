/dynamic-variables:
  get:
    summary: Lists the dynamic variables available for use in response templates.
    operationId: dynamicVariablesGet
    tags:
    - Resources
    parameters:
    - in: query
      name: scope
      schema:
        type: string
      description: Filters variables by scope (e.g. global, elementals).
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/dynamicVariable.yaml'
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
