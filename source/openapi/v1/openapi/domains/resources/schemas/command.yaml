type: object
properties:
  id:
    type: integer
  moduleId:
    type: integer
  commandTrigger:
    type: string
  aliases:
    type: array
    items:
      type: string
  description:
    type: string
  categoryName:
    type: string
    nullable: true
  icon:
    type: string
  isActive:
    type: boolean
  responseConfig:
    type: object
    description: Response configuration (text, media, and variables).
  customConfig:
    type: object
    description: Customizable command parameters.
  accessLevel:
    type: string
    enum: [community, club, admin]
  authorizedGroupIds:
    type: array
    items:
      type: string
      format: uuid
    description: List of group IDs authorized to use the command.
  metricExecutions:
    type: integer