type: object
required:
  - name
  - type
  - description
properties:
  id:
    type: string
  name:
    type: string
  description:
    type: string
  type:
    type: string
    enum: [elemental, skin]
  isActive:
    type: boolean
    default: true
  commandIds:
    type: array
    items:
      type: integer
    description: Array com os IDs dos comandos que utilizam este conteúdo.