# Available group destination modes.
/groups/modes:
  get:
    summary: Lists the available destination modes for groups.
    operationId: groupsModesGet
    tags:
    - Groups
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
