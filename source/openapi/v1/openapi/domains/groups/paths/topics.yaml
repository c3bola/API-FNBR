# Telegram forum topic management endpoints.
/groups/{groupId}/moderation-bots/{botId}/topics:
  post:
    summary: Creates a new topic in the group (Telegram API) and saves it to the configuration.
    operationId: groupsGroupIdModerationBotsBotIdTopicsPost
    tags:
    - Groups
    - Moderation
    parameters:
    - in: path
      name: groupId
      required: true
      schema:
        type: string
    - in: path
      name: botId
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/topicCreateRequest.yaml#/TopicCreateRequest
    responses:
      '201':
        description: Topic created.
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
/groups/{groupId}/moderation-bots/{botId}/topics/{topicId}:
  patch:
    summary: Opens or closes an existing topic (Telegram API) and updates the configuration.
    operationId: groupsGroupIdModerationBotsBotIdTopicsTopicIdPatch
    tags:
    - Groups
    - Moderation
    parameters:
    - in: path
      name: groupId
      required: true
      schema:
        type: string
    - in: path
      name: botId
      required: true
      schema:
        type: string
    - in: path
      name: topicId
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/topicPatchRequest.yaml#/TopicPatchRequest
    responses:
      '200':
        description: Topic status updated.
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
