# Optional batch update payload. Fields are optional so callers can update only changed values.
UpdateGroupRequest:
  type: object
  properties:
    name:
      type: string

    description:
      type: string
      nullable: true

    language:
      type: string

    mode:
      type: string

    visibility:
      type: string

    themeColor:
      type: string

    iconName:
      type: string

    coverImageUrl:
      type: string
      description: "Image URL or Base64 string"
      nullable: true

    isLinkedToChannel:
      type: boolean

    linkedChannelId:
      type: string
      format: uuid
      nullable: true

    isForum:
      type: boolean