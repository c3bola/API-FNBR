# Groups domain aggregator. Keep group paths and schemas organized by functional area.
paths:
  /groups:
    $ref: ./paths/groups.yaml#/~1groups

  /groups/{groupId}:
    $ref: ./paths/groups.yaml#/~1groups~1{groupId}

  /groups/channels/available:
    $ref: ./paths/groups.yaml#/~1groups~1channels~1available

  /groups/{groupId}/config:
    $ref: ./paths/configuration.yaml#/~1groups~1{groupId}~1config

  /groups/{groupId}/blacklist:
    $ref: ./paths/blacklist.yaml#/~1groups~1{groupId}~1blacklist

  /groups/{groupId}/blacklist/{itemId}:
    $ref: ./paths/blacklist.yaml#/~1groups~1{groupId}~1blacklist~1{itemId}

  /groups/{groupId}/moderation-bots:
    $ref: ./paths/moderation-bots.yaml#/~1groups~1{groupId}~1moderation-bots

  /groups/{groupId}/moderation-bots/{botId}/status:
    $ref: ./paths/moderation-bots.yaml#/~1groups~1{groupId}~1moderation-bots~1{botId}~1status

  /groups/{groupId}/moderation-bots/{botId}/config:
    $ref: ./paths/moderation-bots.yaml#/~1groups~1{groupId}~1moderation-bots~1{botId}~1config

  /groups/{groupId}/moderation-bots/{botId}/topics:
    $ref: ./paths/topics.yaml#/~1groups~1{groupId}~1moderation-bots~1{botId}~1topics

  /groups/{groupId}/moderation-bots/{botId}/topics/{topicId}:
    $ref: ./paths/topics.yaml#/~1groups~1{groupId}~1moderation-bots~1{botId}~1topics~1{topicId}

  /groups/modes:
    $ref: ./paths/modes.yaml#/~1groups~1modes

components:
  schemas:
    GroupSummary:
      $ref: ./schemas/groupSummary.yaml#/GroupSummary

    GroupDetail:
      $ref: ./schemas/groupDetail.yaml#/GroupDetail

    UpdateGroupRequest:
      $ref: ./schemas/updateGroupRequest.yaml#/UpdateGroupRequest

    AvailableChannel:
      $ref: ./schemas/availableChannel.yaml#/AvailableChannel

    GroupConfig:
      $ref: ./schemas/groupConfig.yaml#/GroupConfig

    ModerationBotStatus:
      $ref: ./schemas/moderationBotStatus.yaml#/ModerationBotStatus

    TopicCreateRequest:
      $ref: ./schemas/topicCreateRequest.yaml#/TopicCreateRequest

    TopicPatchRequest:
      $ref: ./schemas/topicPatchRequest.yaml#/TopicPatchRequest

    BlacklistItem:
      $ref: ./schemas/blacklistItem.yaml#/BlacklistItem

    NewBlacklistItem:
      $ref: ./schemas/newBlacklistItem.yaml#/NewBlacklistItem