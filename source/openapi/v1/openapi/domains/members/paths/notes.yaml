# Internal staff note endpoints.
/members/{memberId}/notes:
  get:
    summary: Lists internal staff notes for the member.
    tags:
    - Members
    parameters:
    - in: path
      name: memberId
      required: true
      schema:
        type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/staffNote.yaml#/StaffNote
  post:
    summary: Adds an internal note about the member.
    tags:
    - Members
    parameters:
    - in: path
      name: memberId
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              text:
                type: string
    responses:
      '201':
        description: Note added.
/members/{memberId}/notes/{noteId}:
  delete:
    summary: Removes a staff note.
    tags:
    - Members
    parameters:
    - in: path
      name: memberId
      required: true
      schema:
        type: string
    - in: path
      name: noteId
      required: true
      schema:
        type: string
    responses:
      '204':
        description: Note removed.
