# Member listing and detail endpoints.
/members:
  get:
    summary: Lists members with filtering and pagination support.
    operationId: membersGet
    tags:
    - Members
    parameters:
    - in: query
      name: search
      schema:
        type: string
    - in: query
      name: role
      schema:
        type: string
        enum:
        - Admin
        - VIP
        - Membro
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/member.yaml#/Member
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
/members/{memberId}:
  get:
    summary: Gets details for a specific member.
    operationId: membersMemberIdGet
    tags:
    - Members
    parameters:
    - in: path
      name: memberId
      required: true
      schema:
        type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/member.yaml#/Member
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
