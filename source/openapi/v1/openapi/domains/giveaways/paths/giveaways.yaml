# Giveaway creation, removal, and drawing endpoints.
/giveaways:
  get:
    summary: Lists all giveaways (active and completed).
    operationId: giveawaysGet
    tags:
    - Giveaways
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/giveaway.yaml#/Giveaway
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
  post:
    summary: Creates a new giveaway and publishes its preview on Telegram.
    operationId: giveawaysPost
    tags:
    - Giveaways
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/newGiveaway.yaml#/NewGiveaway
    responses:
      '201':
        description: Giveaway created successfully.
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
/giveaways/{id}:
  delete:
    summary: Removes a giveaway (deleting the Telegram message when applicable).
    operationId: giveawaysIdDelete
    tags:
    - Giveaways
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    responses:
      '204':
        description: Giveaway removed.
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
/giveaways/{id}/draw:
  post:
    summary: Runs the giveaway and immediately selects the winners.
    operationId: giveawaysIdDrawPost
    tags:
    - Giveaways
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Giveaway completed. Notifications sent to the winners.
      '401':
        $ref: ../../../components/responses.yaml#/responses/Unauthorized
