# Current authenticated session endpoint.
/auth/me:
  get:
    summary: Returns the current session context (user, authorized bots, and dynamic navigation).
    tags:
    - Auth
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Session context loaded successfully.
        content:
          application/json:
            schema:
              $ref: ../schemas/sessionContext.yaml#/SessionContext
      '401':
        description: Missing or invalid token.
