    ProviderAuthPayload:
      $ref: ./schemas/providerAuthPayload.yaml#/ProviderAuthPayload
    SessionContext:
      $ref: ./schemas/sessionContext.yaml#/SessionContext
    UserContext:
      $ref: ./schemas/userContext.yaml#/UserContext
    BotAccess:
      $ref: ./schemas/botAccess.yaml#/BotAccess
    NavSection:
      $ref: ./schemas/navSection.yaml#/NavSection
    NavItem:
      $ref: ./schemas/navItem.yaml#/NavItem