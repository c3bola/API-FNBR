# Main OpenAPI entrypoint. Keep domain contracts in their respective domain folders.
openapi: 3.0.0
info:
  title: Fortnite Brasil Admin API
  description: >
    Management API for the Fortnite Brasil ecosystem. Replay resources expose
    normalized observations; analytics aggregate only metrics supported by the
    persisted replay model.
  version: 1.2.0
servers:
- url: http://localhost:3000/api/v1
  description: Development Server
security:
- bearerAuth: []
tags:
- name: Auth
  description: Authentication and session management
- name: Groups
  description: Group management and global configuration
- name: Moderation
  description: Member and bot moderation operations
- name: Members
  description: Community member lookup and moderation
- name: VIPs
  description: VIP Club subscription management
- name: Announcements
  description: Bulk announcement delivery and scheduling
- name: Giveaways
  description: Automated giveaway creation and execution
- name: Resources
  description: Bot modules, commands, responses, and dynamic variables
- name: Replay Files
  description: Replay file metadata and processing history
- name: Replay Ingestion
  description: Authenticated write operations for Replay file ingestion
- name: Replay Diagnostics
  description: Administrative ingestion timelines and data integrity metrics
- name: Matches
  description: Fortnite matches and match participants
- name: Players
  description: Player identities and per-match statistics
- name: Containers
  description: Replay-observed container interactions
- name: Rewards
  description: Raw treasure and prize-handler observations
- name: Vehicles
  description: Vehicle references in replicated movement samples
- name: POIs
  description: POI tags observed in map data; no named visit catalog
- name: Safe Zones
  description: Safe-zone center and radius observations
- name: Eliminations
  description: Match-scoped elimination events and kill feed
- name: Teams
  description: Match-scoped groupings derived from recorded team indexes
- name: Maps
  description: Map grids, observed paths, POI tags, and map actors
- name: Weapons
  description: Weapon actor and equipped-item observations
- name: Items
  description: Dropped item observations
- name: Analytics
  description: Aggregates limited to persisted and explicitly identified observations
paths:
  $ref: ./domains/all-paths.yaml#/paths
components:
  securitySchemes:
    $ref: ./components/security.yaml
  responses:
    $ref: ./components/responses.yaml#/responses
  schemas:
    $ref: ./domains/all-schemas.yaml#/schemas
