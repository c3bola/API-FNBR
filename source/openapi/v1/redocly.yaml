# Redocly configuration for the modular Fortnite Brasil Admin API.
# The API entrypoint is resolved relative to this configuration file.
apis:
  fortnite-admin:
    root: ./openapi/index.yaml
extends:
  - recommended

rules:
  # Desativa o alerta sobre o localhost
  no-server-example.com: off
  
  # Desativa a obrigatoriedade de ter operationId nas rotas
  operation-operationId: off
  
  # Desativa a obrigatoriedade de documentar erros 4XX
  operation-4xx-response: off
  
  # Desativa o aviso de falta de licença
  info-license: off
  
  
